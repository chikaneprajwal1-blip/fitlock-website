<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fitlock - Device</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="protected">

  <header>
    <h1>Fitlock</h1>
    <div>
      <span id="userEmail" class="who"></span>
      <a href="#" id="logout">Log out</a>
    </div>
  </header>

  <main class="page">
    <a class="back" href="parent.html">← All devices</a>
    <h2 id="deviceName"></h2>
    <p><a class="back" id="childLink" href="#">Open this child's view →</a></p>

    <div class="tabs">
      <button class="tab on" data-tab="screen">Screen time</button>
      <button class="tab" data-tab="exercise">Exercise</button>
      <button class="tab" data-tab="controls">Controls</button>
    </div>

    <div id="tabContent"></div>
  </main>

  <script type="module" src="device.js"></script>
</body>
</html>
