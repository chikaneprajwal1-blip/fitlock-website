<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fitlock - Parent dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="protected">

  <header>
    <h1>Fitlock</h1>
    <div>
      <span id="userEmail" class="who"></span>
      <a href="#" id="logout">Log out</a>
    </div>
  </header>

  <main class="page">
    <h2>Parent dashboard</h2>

    <div class="stats">
      <div class="stat">
        <span class="stat-label">Devices connected</span>
        <span class="stat-number" id="countDevices">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Apps blocked</span>
        <span class="stat-number" id="countBlocked">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Time limits set</span>
        <span class="stat-number" id="countLimits">0</span>
      </div>
    </div>

    <h3>Your children's devices</h3>
    <div id="deviceList" class="device-list"></div>

    <h3>Add a child device</h3>
    <div class="box">
      <input class="text-input" id="childName" placeholder="Child's name or device (e.g. Riya's phone)">
      <button class="btn-small primary" id="createCode">Create pairing code</button>
      <div id="codeResult"></div>
    </div>

    <p><button class="btn-small" id="addSamples">Add 2 sample devices (for demo)</button></p>
  </main>

  <script type="module" src="parent.js"></script>
</body>
</html>
