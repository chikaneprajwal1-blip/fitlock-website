<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fitlock - Parent login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Fitlock</h1>
    <a href="index.html">Home</a>
  </header>

  <main class="form-box">
    <h2 id="formTitle">Parent login</h2>

    <form id="loginForm">
      <label for="email">Email</label>
      <input type="email" id="email" required>

      <label for="password">Password</label>
      <input type="password" id="password" minlength="6" required>

      <p id="error" class="error"></p>
      <button type="submit" class="button" id="submitBtn">Log in</button>
    </form>

    <p class="switch-text">
      <span id="switchText">New here?</span>
      <button type="button" class="link-btn" id="switchBtn">Create an account</button>
    </p>
  </main>

  <script type="module" src="login.js"></script>
</body>
</html>
