<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fitlock - Child device</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Fitlock</h1>
    <a href="parent.html">Parent view</a>
  </header>

  <main class="page">
    <h2>Child device</h2>
    <p class="muted">Showing: <select id="deviceSelect"></select></p>
    <div class="phone" id="phone"></div>
        <div class="box connect">
      <h3 style="margin-top:0">Connect a new device</h3>
      <p class="muted">Enter the 6-digit code from the parent.</p>
      <input class="text-input" id="codeInput" inputmode="numeric" maxlength="7" placeholder="123 456">
      <button class="btn-small primary" id="connectBtn">Connect</button>
      <p class="error" id="connectMsg"></p>
    </div>
  </main>

  <script src="data.js"></script>
  <script src="child.js"></script>
</body>
